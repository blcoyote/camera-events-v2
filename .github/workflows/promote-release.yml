name: Promote Image to Release

on:
  workflow_run:
    workflows: ['Build & Push Docker Image']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to promote (defaults to latest main build)'
        required: false
      run_number:
        description: 'Build workflow run number (for version tag, e.g. 42)'
        required: false

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: promote-release
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Both jobs run on the self-hosted runner in its own Portainer stack
  # (`github-runner` service in docker-compose.runner.yml), so the deploy
  # webhooks can point at Portainer's LAN address.
  promote-to-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, camera-events-deploy]
    environment: test
    steps:
      - name: Trigger test deploy webhook
        run: |
          echo "::add-mask::${{ secrets.TEST_WEBHOOK_URL }}"
          curl -fsS -X POST "${{ secrets.TEST_WEBHOOK_URL }}"

  promote-to-prod:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, camera-events-deploy]
    environment: release
    needs: promote-to-test
    steps:
      - name: Resolve source SHA
        id: resolve
        run: |
          SHA="${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}"
          if [ -z "$SHA" ]; then
            echo "Could not resolve a source SHA" >&2
            exit 1
          fi
          SHORT=$(echo "$SHA" | cut -c1-7)
          RUN_NUM="${{ inputs.run_number || github.event.workflow_run.run_number }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "version=0.0.${RUN_NUM}" >> "$GITHUB_OUTPUT"
          echo "Promoting sha-$SHORT to :release (version 0.0.${RUN_NUM})"

      # crane re-tags in the registry directly: no Docker daemon needed, so the
      # self-hosted runner does not get the host's Docker socket. The
      # multi-arch index is tagged as-is (same digest).
      - uses: imjasonh/setup-crane@v0.7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Tag image as release
        run: |
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.resolve.outputs.short }}"
          crane tag "$SRC" release
          crane tag "$SRC" "${{ steps.resolve.outputs.version }}"

      - name: Summary
        run: |
          echo "Promoted \`sha-${{ steps.resolve.outputs.short }}\` → \`:release\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger deploy webhook
        run: |
          echo "::add-mask::${{ secrets.RELEASE_WEBHOOK_URL }}"
          curl -fsS -X POST "${{ secrets.RELEASE_WEBHOOK_URL }}"
