services:
  app:
    image: ghcr.io/blcoyote/camera-events-v2:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      MQTT_URL: mqtt://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:1883
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_URL: https://${DNS_NAME:-localhost}
      FRIGATE_URL: ${FRIGATE_URL}
      FRIGATE_MOCK: ${FRIGATE_MOCK:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Metrics → Alloy on the observability network (portainer-traefik/observability)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
      OTEL_SERVICE_NAME: camera-events-v2
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=test,deployment.environment.name=test
    volumes:
      - ce-v2-test-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.ce2-test.rule=Host(`$DNS_NAME`)
      - traefik.http.routers.ce2-test.entrypoints=websecure
      - traefik.http.routers.ce2-test.tls=true
      - traefik.http.routers.ce2-test.tls.certresolver=letsencrypt
      - traefik.http.services.ce2-test.loadbalancer.server.port=3000
      - traefik.http.routers.ce2-test.middlewares=ce2-test-sec@docker
      # HSTS, X-Content-Type-Options, X-Frame-Options and Referrer-Policy are set by
      # secure-headers@file on Traefik's websecure entrypoint (portainer-traefik repo).
      # Entrypoint middleware overrides router middleware, so setting them here has no effect.
      - traefik.http.middlewares.ce2-test-sec.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - traefik.http.middlewares.ce2-test-sec.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.ce2-test-sec.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin
      # script-src requires 'unsafe-inline': TanStack Start's streaming SSR emits
      # dynamic per-request inline scripts (hydration bootstrap + $tsr stream
      # barrier) that cannot be pre-hashed. A hash/nonce here makes browsers
      # ignore 'unsafe-inline', which blocks those scripts and breaks hydration.
      - "traefik.http.middlewares.ce2-test-sec.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleusercontent.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    networks:
      - ce-v2-test
      - proxy
      - observability
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq-test:
        condition: service_healthy

  rabbitmq-test:
    # Official image (not a local build) so Portainer can compare its digest
    # against Docker Hub and show up-to-date / outdated status. Config is
    # injected via inline `configs` below instead of being baked into an image.
    image: rabbitmq:4-management-alpine
    pull_policy: always
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq-conf
        target: /etc/rabbitmq/conf.d/custom.conf
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ce-v2-test
    labels:
      - 'traefik.enable=false'

configs:
  rabbitmq-plugins:
    content: |
      [rabbitmq_management,rabbitmq_mqtt].
  rabbitmq-conf:
    content: |
      # MQTT listener on standard port
      mqtt.listeners.tcp.default = 1883
      mqtt.allow_anonymous = false

      # Frigate publishes to topics like frigate/events — map to AMQP exchange
      mqtt.exchange = amq.topic
      mqtt.vhost = /

      # Keep connections alive (86400 seconds = 24 hours)
      mqtt.max_session_expiry_interval_seconds = 86400

volumes:
  ce-v2-test-data:
  rabbitmq-test-data:

networks:
  ce-v2-test:
  proxy:
    external: true
  observability:
    external: true
