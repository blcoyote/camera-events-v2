services:
  app:
    image: ghcr.io/blcoyote/camera-events-v2:release
    pull_policy: always
    restart: unless-stopped
    ports:
      # Bound to loopback: Traefik reaches the app over the `proxy` network,
      # not the host port. This keeps the app off 0.0.0.0 (no plain-HTTP bypass
      # of Traefik's TLS + security headers).
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      MQTT_URL: mqtt://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:1883
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_URL: https://${DNS_NAME:-localhost}
      FRIGATE_URL: ${FRIGATE_URL}
      FRIGATE_MOCK: ${FRIGATE_MOCK:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Metrics → Alloy on the observability network (portainer-traefik/observability)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
      OTEL_SERVICE_NAME: camera-events-v2
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=prod,deployment.environment.name=prod
    volumes:
      - ce-v2-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.ce2.rule=Host(`$DNS_NAME`)
      - traefik.http.routers.ce2.entrypoints=websecure
      - traefik.http.routers.ce2.tls=true
      - traefik.http.routers.ce2.tls.certresolver=letsencrypt
      - traefik.http.services.ce2.loadbalancer.server.port=3000
      - traefik.http.routers.ce2.middlewares=ce2-sec@docker
      # HSTS, X-Content-Type-Options, X-Frame-Options and Referrer-Policy are set by
      # secure-headers@file on Traefik's websecure entrypoint (portainer-traefik repo).
      # Entrypoint middleware overrides router middleware, so setting them here has no effect.
      - traefik.http.middlewares.ce2-sec.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - traefik.http.middlewares.ce2-sec.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.ce2-sec.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin
      # script-src requires 'unsafe-inline': TanStack Start's streaming SSR emits
      # dynamic per-request inline scripts (hydration bootstrap + $tsr stream
      # barrier) that cannot be pre-hashed. A hash/nonce here makes browsers
      # ignore 'unsafe-inline', which blocks those scripts and breaks hydration.
      - "traefik.http.middlewares.ce2-sec.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://*.googleusercontent.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    networks:
      - ce-v2-network
      - proxy
      - observability
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    # Official image (not a local build) so Portainer can compare its digest
    # against Docker Hub and show up-to-date / outdated status. Config is
    # injected via inline `configs` below instead of being baked into an image.
    image: rabbitmq:4-management-alpine
    pull_policy: always
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
      - source: rabbitmq-conf
        target: /etc/rabbitmq/conf.d/custom.conf
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - '0.0.0.0:1883:1883'
      # Management UI — admin only, never expose publicly. Reach via SSH tunnel.
      - '127.0.0.1:15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ce-v2-network
    labels:
      - 'traefik.enable=false'

  # Self-hosted GitHub Actions runner for the release workflow
  # (.github/workflows/promote-release.yml). It lives only in this prod compose
  # file, not in docker-compose.test.yml, so the two Portainer stacks run a
  # single runner between them.
  #
  # GitHub's official image. Nothing in it runs as root: the image's user is
  # `runner`, and no-new-privileges blocks the image's passwordless sudo.
  # No PAT is stored: it registers once with a one-hour registration token
  # (GITHUB_RUNNER_REGISTRATION_TOKEN) and keeps its install and registration
  # on the ce-v2-runner volume, so restarts skip registration. To register
  # again, remove the volume and set a fresh token.
  #
  # The image is pinned so a prod redeploy (which this runner triggers) cannot
  # recreate it mid-job. The runner binary updates itself inside the volume.
  # Its own network keeps it off ce-v2-network; host-published ports (MQTT
  # 1883) are still reachable through the host's address, like from any LAN
  # machine.
  github-runner:
    image: ghcr.io/actions/actions-runner:2.338.2
    pull_policy: missing
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${GITHUB_RUNNER_REGISTRATION_TOKEN:-}
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -f .runner ]; then
          if [ -z "$$RUNNER_TOKEN" ]; then
            echo 'Runner is not registered. Set GITHUB_RUNNER_REGISTRATION_TOKEN on the stack (see README, "Release runner").' >&2
            exit 1
          fi
          ./config.sh --unattended --replace \
            --url https://github.com/blcoyote/camera-events-v2 \
            --token "$$RUNNER_TOKEN" \
            --name camera-events-portainer \
            --labels camera-events-deploy
        fi
        unset RUNNER_TOKEN
        exec ./run.sh
    volumes:
      - ce-v2-runner:/home/runner
    security_opt:
      - no-new-privileges:true
    networks:
      - ci-runner
      # Shared only with the Portainer container, so the release webhooks can
      # use http://portainer:9000/api/stacks/webhooks/<id> without leaving
      # Docker. Create it once and connect Portainer (see README).
      - portainer-webhooks
    labels:
      - 'traefik.enable=false'

configs:
  rabbitmq-plugins:
    content: |
      [rabbitmq_management,rabbitmq_mqtt].
  rabbitmq-conf:
    content: |
      # MQTT listener on standard port
      mqtt.listeners.tcp.default = 1883
      mqtt.allow_anonymous = false

      # Frigate publishes to topics like frigate/events — map to AMQP exchange
      mqtt.exchange = amq.topic
      mqtt.vhost = /

      # Keep connections alive (86400 seconds = 24 hours)
      mqtt.max_session_expiry_interval_seconds = 86400

volumes:
  ce-v2-data:
  rabbitmq-data:
  ce-v2-runner:

networks:
  ce-v2-network:
  ci-runner:
  proxy:
    external: true
  observability:
    external: true
  portainer-webhooks:
    external: true
